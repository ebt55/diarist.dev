name: Deploy diarist.dev

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, so the docs and the release version stay fresh without a commit.
    - cron: "17 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # Reads the docs from raw.githubusercontent.com and the release from the
        # updater manifest; fails when a docs source is missing.
        run: bun run build
        env:
          DOCS_SOURCE: remote

      - name: Check
        run: bun run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
